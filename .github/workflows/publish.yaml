name: Publishing
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual publish — run {0}', github.run_number) || github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install
      - run: yarn run build
      - name: Build Cocoa SDK from Carthage
        run: make build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --access public --tag latest
